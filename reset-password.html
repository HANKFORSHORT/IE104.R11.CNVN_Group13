<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Astra</title>
  <meta name="description" content="" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <span data-include="back-link" data-href="index.html" data-label="to main page" data-fixed></span>

  <span data-include="theme-toggle" data-class="auth-theme-toggle"></span>

  <main class="auth-page">
    <section class="auth-card-signin" aria-labelledby="auth-title">
      <a class="auth-logo" href="index.html" aria-label="Astra home">
        <img src="images/logo.svg" alt="" width="64" height="64" />
      </a>
      <h1 class="auth-title auth-title-tight" id="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Choose a new password for your Astra account.</p>

      <div data-include="auth-banner"></div>

      <form class="auth-form" data-auth-form="reset" novalidate>
        <div class="auth-field">
          <label for="password" class="auth-label">New password</label>
          <input type="password" id="password" name="password" class="auth-input" autocomplete="new-password" aria-invalid="false" aria-describedby="password-error" required />
          <p class="auth-error" id="password-error"></p>
        </div>
        <div class="auth-field">
          <label for="confirm" class="auth-label">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" class="auth-input" autocomplete="new-password" aria-invalid="false" aria-describedby="confirm-error" required />
          <p class="auth-error" id="confirm-error"></p>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-block">Reset password</button>
        <span data-include="back-link" data-href="login.html" data-label="to sign in"></span>
      </form>
    </section>
  </main>
  <div data-include="auth-popup"></div>
</body>
</html>
