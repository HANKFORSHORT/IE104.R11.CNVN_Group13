<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password · Astra</title>
  <meta name="description" content="Set a new password for your Astra account using the link from your email." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problems.css" />
  <link rel="stylesheet" href="css/account.css" />
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/account.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <main class="account-page" data-account-page="reset-password">
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="login.html">Sign in</a> / Reset password</div>
        <h1>Choose a new password</h1>
        <p>Enter a new password for your Astra account.</p>
      </div>
    </div>

    <section class="account-section">
      <div class="container">

        <div class="panel panel-narrow" data-reset-invalid hidden>
          <div class="panel-head">
            <h2>This link is not valid</h2>
            <p>The reset link is missing its token or has expired.</p>
          </div>
          <div class="panel-foot">
            <a class="btn btn-primary" href="forgot-password.html">Request a new link</a>
          </div>
        </div>

        <form class="panel panel-narrow" id="reset-form" data-reset-form novalidate aria-labelledby="reset-heading" hidden>
          <div class="panel-head">
            <h2 id="reset-heading">New password</h2>
            <p>Use at least 8 characters, including a number and a lowercase letter.</p>
          </div>
          <div class="panel-body">
          <div class="field">
            <label class="field-label" for="reset-password">New password</label>
            <input class="field-input" type="password" id="reset-password" name="password" aria-invalid="false" aria-describedby="reset-password-error" autocomplete="new-password" required />
            <p class="field-error" id="reset-password-error" role="alert"></p>
          </div>
          <div class="field">
            <label class="field-label" for="reset-confirm">Re-type new password</label>
            <input class="field-input" type="password" id="reset-confirm" name="confirm" aria-invalid="false" aria-describedby="reset-confirm-error" autocomplete="new-password" required />
            <p class="field-error" id="reset-confirm-error" role="alert"></p>
          </div>
          </div>
          <div class="panel-foot">
            <button type="submit" class="btn btn-primary">Reset password</button>
            <span data-include="back-link" data-href="login.html" data-label="to sign in"></span>
            <p class="form-status" role="status" aria-live="polite" data-form-status></p>
          </div>
        </form>

      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="auth-popup"></div>
</body>
</html>
