<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solved problems · Astra</title>
  <meta name="description" content="Problems a competitor has solved on Astra." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problems.css" />
  <link rel="stylesheet" href="css/account.css" />
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/account.js" defer></script>
</head>
<body>
  <div data-include="header"></div>
  <main class="account-page" data-account-page="solved">
    <div class="page-header"><div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="profile.html">Account</a> / Solved problems</div>
      <h1>Solved problems</h1><p>Accepted solutions by <span data-solved-owner></span>.</p>
    </div></div>
    <section class="account-section"><div class="container">
      <div class="toolbar"><h2>Accepted solutions</h2><span><strong data-solved-count>0</strong> problems solved</span></div>
      <p class="sample-note" data-sample-note hidden>Sample accepted solutions for the demo account.</p>
      <ul class="solved-list" id="solved-list" aria-label="Solved problems"></ul>
      <div class="panel empty-state" data-solved-empty hidden><h2>No solved problems to display</h2><p>Accepted solutions will appear here when results are available.</p><a class="btn btn-primary" href="problems.html">Browse problems</a></div>
      <div class="actions"><span data-include="back-link" data-href="profile.html" data-label="to profile"></span></div>
    </div></section>
  </main>
  <div data-include="footer"></div>
  <div data-include="auth-popup"></div>
</body>
</html>
