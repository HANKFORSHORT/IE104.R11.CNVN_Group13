<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications · Astra</title>
  <meta name="description" content="Your Astra notifications and their read status." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problems.css" />
  <link rel="stylesheet" href="css/account.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/account.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <main class="account-page" data-account-page="notifications">
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="profile.html">Account</a> / Notifications</div>
        <h1>Notifications</h1>
        <p>Contest reminders, submission verdicts and account activity.</p>
      </div>
    </div>

    <section class="account-section">
      <div class="container">
        <div class="toolbar">
          <p role="status" aria-live="polite" data-unread-count></p>
          <button type="button" class="btn btn-primary btn-sm" data-mark-all-read>Mark all as read</button>
        </div>

        <ul class="notice-list" id="notification-list" aria-label="Notifications"></ul>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="auth-popup"></div>
</body>
</html>
