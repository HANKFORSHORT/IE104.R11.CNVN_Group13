<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym · Astra</title>
  <meta name="description" content="" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/contest.css" />
  <link rel="stylesheet" href="css/table.css" />
  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/table-filter.js" defer></script>
  <script src="js/problem-sets.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html">Home</a> / Gym
        </div>
        <h1 style="color: var(--peach);">Gym & practice</h1>
        <p style="max-width: 60ch;">"Unrated training sets built from retired rounds and community mashups. Run them solo or race a friend — nothing here touches your rating."</p>
      </div>
    </div>

    <section style="padding-top:2.5rem;">
      <div class="container">

        <div class="filters-bar" data-filter-table="#trainingList">
          <input type="text" placeholder="Search trainings&hellip;" data-filter-search />

          <select aria-label="Filter by difficulty" data-filter="difficulty">
            <option value="any">Any difficulty</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>

          <select aria-label="Filter by duration" data-filter="duration" data-filter-type="range">
            <option value="any">Any duration</option>
            <option value="0-119">Under 2 hours</option>
            <option value="120-240">2&ndash;4 hours</option>
            <option value="241-9999">4+ hours</option>
          </select>

          <button class="btn btn-primary btn-sm" type="button" data-filter-apply>Filter</button>
        </div>

        <p id="gym-status" class="collection-status" role="status"></p>
        <div class="grid grid-3 training-grid" id="trainingList" style="margin-bottom: 2.4rem;">
          <p id="emptyRow" data-filter-empty hidden>No trainings found.</p>
        </div>



      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="auth-popup"></div>
</body>
</html>
