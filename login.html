<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Astra</title>
  <meta name="description" content="" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/main.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <a href="index.html" class="auth-back-link" aria-label="Back to main page">
    <span aria-hidden="true">&larr;</span> Back<span class="auth-back-extra" aria-hidden="true">to main page</span>
  </a>

  <button class="theme-toggle auth-theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <img class="icon-sun" src="images/sun.svg" alt="">
    <img class="icon-moon" src="images/moon.svg" alt="">
  </button>

  <main class="auth-page">
    <section class="auth-card-signin" aria-labelledby="auth-title">
      <a class="auth-logo" href="index.html" aria-label="Astra home">
        <img src="images/logo.svg" alt="" width="64" height="64" />
      </a>
      <h1 class="auth-title" id="auth-title">Sign in to Astra</h1>

      <div class="auth-banner" data-auth-banner role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
        <span></span>
      </div>

      <form class="auth-form" data-auth-form="login" novalidate>
        <div class="auth-field" id="wrap-identifier">
          <label for="identifier" class="auth-label">Username or email address</label>
          <input type="text" id="identifier" name="identifier" class="auth-input" placeholder="Username or email address" autocomplete="username" aria-invalid="false" aria-describedby="identifier-error" required aria-required="true" />
          <p class="auth-error" id="identifier-error"></p>
        </div>

        <div class="auth-field" id="wrap-password">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-password">
            <input type="password" id="password" name="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password" aria-invalid="false" aria-describedby="password-error" required aria-required="true" />
            <button type="button" class="auth-password-toggle" data-toggle-password aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="eye-open" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle class="eye-open" cx="12" cy="12" r="3"/><path class="eye-closed" d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A16.6 16.6 0 0 0 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="auth-error" id="password-error"></p>
        </div>

        <p class="auth-help">Forgot password? <a class="auth-link" href="forgot-password.html">Change password</a></p>

        <label class="auth-check">
          <input type="checkbox" name="remember" />
          Keep me signed in
        </label>

        <button type="submit" class="btn btn-primary auth-btn-block">Sign in</button>
        <a class="btn btn-secondary auth-btn-block" href="register.html">Create new account</a>

        <div class="auth-divider" role="separator">or</div>

        <button type="button" class="btn btn-secondary auth-btn-block" disabled title="Not available yet: needs backend integration">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.7l4 3.1C6.3 7 8.9 4.8 12 4.8z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="btn btn-secondary auth-btn-block" disabled title="Not available yet: needs backend integration">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
          Continue with Facebook
        </button>
      </form>
    </section>
  </main>
</body>
</html>
