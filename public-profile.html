<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public profile · Astra</title>
  <meta name="description" content="View a competitor on Astra: rating, rank and solved problems." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problems.css" />
  <link rel="stylesheet" href="css/account.css" />
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/account.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <main class="account-page" data-account-page="public-profile">

    <div data-user-notfound hidden>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="rankings.html">Rankings</a></div>
        <h1>User not found</h1>
        <p>We could not find that competitor.</p>
      </div>
    </div>

      <section class="account-section">
        <div class="container">
          <div class="panel panel-narrow empty-state">
            <h2>No such user</h2>
            <p>Pick someone from the Rankings to view their profile.</p>
            <a class="btn btn-primary" href="rankings.html">Go to Rankings</a>
          </div>
        </div>
      </section>
    </div>

    <div data-user-profile hidden>
      <div class="page-header">
        <div class="container">
          <div class="breadcrumb"><a href="index.html">Home</a> / <a href="rankings.html">Rankings</a> / Profile</div>
          <div class="profile-head">
            <span class="avatar" aria-hidden="true" data-user-field="initials">?</span>
            <div>
              <h1 data-user-field="handle">username</h1>
              <p data-user-field="subtitle"></p>
            </div>
          </div>
        </div>
      </div>

      <section class="account-section">
        <div class="container">
          <div class="stat-grid">
            <div class="stat"><span class="stat-label" data-user-field="ratingLabel">Rating</span><span class="stat-value" data-user-field="rating">0</span></div>
            <div class="stat"><span class="stat-label" data-user-field="rankLabel">Rank</span><span class="stat-value" data-user-field="rank">#—</span></div>
            <div class="stat"><span class="stat-label" data-user-field="solvedLabel">Problems solved</span><span class="stat-value" data-user-field="solved">0</span></div>
          </div>

          <div class="actions">
            <a class="btn btn-primary" href="solved.html" data-user-link>Solved problems</a>
            <a class="btn btn-secondary" href="submissions.html" data-owner-only hidden>My Submissions</a>
            <a class="btn btn-secondary" href="achievements.html?tab=achievements" data-user-link>Achievements</a>
            <span data-include="back-link" data-href="rankings.html" data-label="to Rankings"></span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div data-include="footer"></div>
  <div data-include="auth-popup"></div>
</body>
</html>
