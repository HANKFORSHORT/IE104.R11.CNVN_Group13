<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Astra</title>
  <meta name="description" content="" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/session.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <span data-include="back-link" data-href="index.html" data-label="to main page" data-fixed></span>

  <button class="theme-toggle auth-theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <img class="icon-sun" src="images/sun.svg" alt="">
    <img class="icon-moon" src="images/moon.svg" alt="">
  </button>

  <main class="auth-page">
    <section class="auth-card-signin" aria-labelledby="auth-title">
      <a class="auth-logo" href="index.html" aria-label="Astra home">
        <img src="images/logo.svg" alt="" width="64" height="64" />
      </a>
      <h1 class="auth-title auth-title-tight" id="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your user account's verified email address and we will send you a password reset link.</p>

      <div class="auth-banner" data-auth-banner role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
        <span></span>
      </div>

      <form class="auth-form" data-auth-form="forgot" novalidate>
        <div class="auth-field" id="wrap-email">
          <label for="email" class="auth-label">Email<span class="required-mark" aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" class="auth-input" placeholder="Enter your email address" autocomplete="email" aria-invalid="false" aria-describedby="email-error" required aria-required="true" />
          <p class="auth-error" id="email-error"></p>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-block">Send password reset email</button>
        <span data-include="back-link" data-href="login.html" data-label="to sign in"></span>
      </form>
    </section>
  </main>
  <div data-include="auth-popup"></div>
</body>
</html>
