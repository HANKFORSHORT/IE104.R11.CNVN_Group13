<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problemset · Astra</title>
    <meta name="description" content="" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/problems.css">
    <link rel="stylesheet" href="css/problems-theme.css">
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/problems.js" defer></script>
</head>

<body>
    <div data-include="header"></div>

    <main>
        <div class="page-header">
            <div class="container">
                <div class="breadcrumb">
                    <a href="index.html">Home</a> / Problemset
                </div>
                <h1 style="color: var(--peach);">Problemset</h1>
                <p style="max-width: 60ch;">
                    Every problem Astra has ever run, searchable by topic and difficulty. Solve them rated, inside the
                    Gym, or just for the satisfaction of a clean accepted verdict.
                </p>
            </div>
        </div>

        <section class="section" style="margin-top: calc(-1 * var(--nav-h));">
            <div class="container">
                <form id="problems-filter-form" class="filters-bar" novalidate>
                    <input id="filter-search" type="text" placeholder="Search by name or number..." aria-label="Search problems">
                    <select id="filter-topic" aria-label="Filter-by-topic">
                        <option value="">All topics</option>
                    </select>
                    <input id="filter-min-rating" type="number" placeholder="Min rating" aria-label="Minimum difficulty">
                    <input id="filter-max-rating" type="number" placeholder="Max rating" aria-label="Maximum difficulty">
                    <button class="btn btn-primary btn-sm" type="submit">Apply filters</button>
                </form>

                <p id="problems-status" class="pd-feedback" role="status" style="margin-bottom: 0.8rem;"></p>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Topics</th>
                                <th>Difficulty</th>
                                <th>Solve rate</th>
                            </tr>
                        </thead>
                        <tbody id="problems-tbody"></tbody>
                    </table>
                </div>

                <div class="flex-between" style="margin-top: 1.6rem;">
                    <p id="problems-count" style="margin: 0; font-size: 0.85rem;">Showing 0 problems</p>
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="btn-prev-page" class="btn btn-secondary btn-sm" type="button" disabled>Previous</button>
                        <button id="btn-next-page" class="btn btn-secondary btn-sm" type="button" disabled>Next</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>
    <div data-include="auth-popup"></div>
</body>

</html>
